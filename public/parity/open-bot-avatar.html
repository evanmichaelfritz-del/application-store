<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Bot Avatar</title>
<style>
.oba {
  width: 960px;
  height: 720px;
  display: flex;
  box-sizing: border-box;
  background: #f3f3f4;
  color: #17181c;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.oba-stage {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.oba-avatar-host {
  width: 420px;
  max-width: calc(100% - 48px);
  aspect-ratio: 1;
}
.oba-compact {
  width: 100%;
  height: 100%;
  min-width: 0;
}
.oba-compact .oba-stage { width: 100%; height: 100%; }
.oba-compact .oba-avatar-host {
  width: 100%;
  max-width: none;
  height: 100%;
}
.oba-panel {
  width: 400px;
  flex: none;
  box-sizing: border-box;
  height: 100%;
  padding: 16px;
  overflow: auto;
  border-left: 1px solid rgba(23, 24, 28, 0.08);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oba-pair {
  display: flex;
  gap: 8px;
}
.oba-pair > .oba-field { flex: 1; min-width: 0; }
.oba-pair .oba-chip { padding: 0 8px; }
.oba-pair .oba-row { flex-wrap: nowrap; }
.oba-name {
  margin: 0;
  font-size: 13px;
  line-height: 18px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
}
.oba-label {
  font-size: 11px;
  line-height: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(23, 24, 28, 0.52);
}
.oba-states {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.oba-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.oba-chip {
  appearance: none;
  flex: none;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-states .oba-chip { width: 100%; }
.oba-chip[aria-pressed="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-chip:hover { background: #f1f1f1; }
.oba-chip[aria-pressed="true"]:hover { background: #3a3a3e; }
.oba-presets {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oba-preset-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.oba-group-name {
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.oba-swatch {
  width: 22px;
  height: 22px;
  padding: 0;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.18);
  cursor: pointer;
}
.oba-swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px #f3f3f4, 0 0 0 4px #17181c;
}
.oba-switch {
  appearance: none;
  flex: none;
  align-self: flex-start;
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-switch[aria-checked="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-stall {
  margin: 0;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-json {
  width: 100%;
  box-sizing: border-box;
  flex: none;
  min-height: 64px;
  height: 64px;
  resize: vertical;
  border-radius: 10px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  padding: 8px 10px;
  font: 400 12px/16px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.oba-import {
  appearance: none;
  align-self: flex-start;
  flex: none;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #17181c;
  background: #17181c;
  color: #ffffff;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-import:hover { background: #3a3a3e; }
.oba-errors {
  margin: 0;
  flex: none;
  padding-left: 18px;
  color: #b42318;
  font-size: 12px;
  line-height: 16px;
}
.oba-credit {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  margin: 0;
  text-align: center;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-credit a { color: inherit; }
#oba-frame > .oba-credit {
  right: auto;
  width: 528px;
}
@media (prefers-reduced-motion: reduce) {
  .oba-chip, .oba-swatch, .oba-import { transition: none; }
}
html[data-reduce-motion="1"] .oba-chip,
html[data-reduce-motion="1"] .oba-swatch,
html[data-reduce-motion="1"] .oba-import { transition: none; }

html, body { margin: 0; height: 100%; background: #f3f3f4; }
body { display: flex; justify-content: center; align-items: center; }
#oba-frame { position: relative; width: 960px; height: 720px; flex: none; }
#oba-root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="oba-frame">
<div id="oba-root"></div>
<p class="oba-credit"><a href="https://x.com/dom_scholz" target="_blank" rel="noopener noreferrer">Dominik Scholz</a> (<a href="https://x.com/dom_scholz" target="_blank" rel="noopener noreferrer">@dom_scholz</a>) · <a href="https://x.com/dom_scholz/status/2117307304395636772" target="_blank" rel="noopener noreferrer">post</a> · <a href="https://github.com/DominikScholz/open-bot-avatar" target="_blank" rel="noopener noreferrer">repo</a> · <a href="https://dominikscholz.github.io/open-bot-avatar/" target="_blank" rel="noopener noreferrer">site</a></p>
</div>

  width: 960px;
  height: 720px;
  display: flex;
  box-sizing: border-box;
  background: #f3f3f4;
  color: #17181c;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.oba-stage {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.oba-avatar-host {
  width: 420px;
  max-width: calc(100% - 48px);
  aspect-ratio: 1;
}
.oba-compact {
  width: 100%;
  height: 100%;
  min-width: 0;
}
.oba-compact .oba-stage { width: 100%; height: 100%; }
.oba-compact .oba-avatar-host {
  width: 100%;
  max-width: none;
  height: 100%;
}
.oba-panel {
  width: 400px;
  flex: none;
  box-sizing: border-box;
  height: 100%;
  padding: 16px;
  overflow: auto;
  border-left: 1px solid rgba(23, 24, 28, 0.08);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oba-pair {
  display: flex;
  gap: 8px;
}
.oba-pair > .oba-field { flex: 1; min-width: 0; }
.oba-pair .oba-chip { padding: 0 8px; }
.oba-pair .oba-row { flex-wrap: nowrap; }
.oba-name {
  margin: 0;
  font-size: 13px;
  line-height: 18px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
}
.oba-label {
  font-size: 11px;
  line-height: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(23, 24, 28, 0.52);
}
.oba-states {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.oba-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.oba-chip {
  appearance: none;
  flex: none;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-states .oba-chip { width: 100%; }
.oba-chip[aria-pressed="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-chip:hover { background: #f1f1f1; }
.oba-chip[aria-pressed="true"]:hover { background: #3a3a3e; }
.oba-presets {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oba-preset-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.oba-group-name {
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.oba-swatch {
  width: 22px;
  height: 22px;
  padding: 0;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.18);
  cursor: pointer;
}
.oba-swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px #f3f3f4, 0 0 0 4px #17181c;
}
.oba-switch {
  appearance: none;
  flex: none;
  align-self: flex-start;
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-switch[aria-checked="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-stall {
  margin: 0;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-json {
  width: 100%;
  box-sizing: border-box;
  flex: none;
  min-height: 64px;
  height: 64px;
  resize: vertical;
  border-radius: 10px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  padding: 8px 10px;
  font: 400 12px/16px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.oba-import {
  appearance: none;
  align-self: flex-start;
  flex: none;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #17181c;
  background: #17181c;
  color: #ffffff;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-import:hover { background: #3a3a3e; }
.oba-errors {
  margin: 0;
  flex: none;
  padding-left: 18px;
  color: #b42318;
  font-size: 12px;
  line-height: 16px;
}
.oba-credit {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  margin: 0;
  text-align: center;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-credit a { color: inherit; }
#oba-frame > .oba-credit {
  right: auto;
  width: 528px;
}
@media (prefers-reduced-motion: reduce) {
  .oba-chip, .oba-swatch, .oba-import { transition: none; }
}
html[data-reduce-motion="1"] .oba-chip,
html[data-reduce-motion="1"] .oba-swatch,

vec3 sampleOuterStudio(vec3 dirS, vec3 jewelTint) {

vec3 sampleInternalStudio(vec3 posS, vec3 dirS, vec3 jewelTint, float isTIR) {
  vec3 d = normalize(dirS);

  // Silky continuous studio cyclorama (color-accurate, zero hard horizon line)
  float upFade = smoothstep(1.0, -1.0, d.y);
  vec3 col = mix(vec3(0.022), jewelTint * 0.22, 0.55) * (0.65 + 0.50 * upFade);

  // Smoothly feathered caustic tabletop bounce beneath the figurine
  float floorRelY = (bottomY - pivot.y) + 2.8;
  if (d.y > -0.05) {
    float dySafe = max(d.y, 0.08);
    float tFloor = clamp((floorRelY - posS.y) / dySafe, 0.0, 260.0);
    vec3 fp = posS + d * tFloor;
    float r2 = dot(fp.xz, fp.xz) / (radius * radius * 0.60);
    float causticPool = exp(-r2 * 0.85);
    float hotCore     = exp(-r2 * 2.4);
    float floorFade   = smoothstep(-0.05, 0.42, d.y);
    col += jewelTint * (1.05 * causticPool + 0.48 * hotCore) * floorFade;

  float leftRim   = pow(max(0.0, dot(d, normalize(vec3(-0.88,  0.12, -0.46)))), 3.4);
  float topGlow   = pow(max(0.0, dot(d, normalize(vec3( 0.05, -0.92, -0.38)))), 3.0);

  float tirBoost = mix(0.92, 1.22, isTIR);
  col += mix(jewelTint, vec3(1.0), 0.52) * (upperLeft * 1.45 + rightRim * 1.15 + leftRim * 1.05 + topGlow * 1.10) * tirBoost;

  return col;
}

    t += max(d * 0.78, 0.06);

    float mid = 0.5 * (lo + hi);
    if (mapSDF(ro + rd * mid) <= 0.0) hi = mid;
    else lo = mid;

  t = hi;

  vec3 p1 = ro + rd * t;
  vec3 n1 = calcNormal(p1);
  vec3 n1S = normalize(view * n1);
  vec3 p1S = view * (p1 - pivot);
  float cos1 = clamp(dot(-rd, n1), 0.0, 1.0);
  float F1 = fresnelSchlick(cos1);

  // --- Opaque Glossy Black Eyes seated cleanly on the front glass surface ---
  float eyeMask = 0.0;

    vec3 local;

  float peak = max(accum.r, max(accum.g, accum.b));
  vec3 col = accum;

    edgeTransparency
    - 0.12 * clamp(directTrans, 0.0, 1.0)
    + 0.52 * smoothstep(0.16, 0.90, lum)

    vec3 eMapped = ePeak > 0.0001 ? eyeColor * ((ePeak / (1.0 + ePeak * 0.4)) / ePeak) : vec3(0.0);

    alpha = mix(alpha, 1.0, eyeMask);

  return vec4(col * alpha, alpha);
