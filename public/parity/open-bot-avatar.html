<style>
.oba {
  width: 960px;
  height: 720px;
  display: flex;
  box-sizing: border-box;
  background: #f3f3f4;
  color: #17181c;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.oba-stage {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.oba-avatar-host {
  width: 420px;
  max-width: calc(100% - 48px);
  aspect-ratio: 1;
}
.oba-compact {
  width: 100%;
  height: 100%;
  min-width: 0;
}
.oba-compact .oba-stage { width: 100%; height: 100%; }
.oba-compact .oba-avatar-host {
  width: 100%;
  max-width: none;
  height: 100%;
}
.oba-panel {
  width: 400px;
  flex: none;
  box-sizing: border-box;
  height: 100%;
  padding: 16px;
  overflow: auto;
  border-left: 1px solid rgba(23, 24, 28, 0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.oba-name {
  margin: 0;
  font-size: 13px;
  line-height: 18px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
}
.oba-label {
  font-size: 11px;
  line-height: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(23, 24, 28, 0.52);
}
.oba-states {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.oba-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.oba-chip {
  appearance: none;
  flex: none;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-states .oba-chip { width: 100%; }
.oba-chip[aria-pressed="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-chip:hover { background: #f1f1f1; }
.oba-chip[aria-pressed="true"]:hover { background: #3a3a3e; }
.oba-presets {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oba-preset-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.oba-group-name {
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.oba-swatch {
  width: 22px;
  height: 22px;
  padding: 0;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.18);
  cursor: pointer;
}
.oba-swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px #f3f3f4, 0 0 0 4px #17181c;
}
.oba-switch {
  appearance: none;
  flex: none;
  align-self: flex-start;
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-switch[aria-checked="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-stall {
  margin: 0;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-json {
  width: 100%;
  box-sizing: border-box;
  flex: none;
  min-height: 64px;
  height: 64px;
  resize: vertical;
  border-radius: 10px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  padding: 8px 10px;
  font: 400 12px/16px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.oba-import {
  appearance: none;
  align-self: flex-start;
  flex: none;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #17181c;
  background: #17181c;
  color: #ffffff;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-import:hover { background: #3a3a3e; }
.oba-errors {
  margin: 0;
  flex: none;
  padding-left: 18px;
  color: #b42318;
  font-size: 12px;
  line-height: 16px;
}
.oba-credit {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  margin: 0;
  text-align: center;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-credit a { color: inherit; }
#oba-frame > .oba-credit {
  right: auto;
  width: 528px;
}
@media (prefers-reduced-motion: reduce) {
  .oba-chip, .oba-swatch, .oba-import { transition: none; }
}
html[data-reduce-motion="1"] .oba-chip,
html[data-reduce-motion="1"] .oba-swatch,
html[data-reduce-motion="1"] .oba-import { transition: none; }

html, body { margin: 0; height: 100%; background: #f3f3f4; }
body { display: flex; justify-content: center; align-items: center; }
#oba-frame { position: relative; width: 960px; height: 720px; flex: none; }
#oba-root { width: 100%; height: 100%; }
</style>
</head>

<div id="oba-frame">
<div id="oba-root"></div>

  width: 960px;
  height: 720px;
  display: flex;
  box-sizing: border-box;
  background: #f3f3f4;
  color: #17181c;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.oba-stage {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.oba-avatar-host {
  width: 420px;
  max-width: calc(100% - 48px);
  aspect-ratio: 1;
}
.oba-compact {
  width: 100%;
  height: 100%;
  min-width: 0;
}
.oba-compact .oba-stage { width: 100%; height: 100%; }
.oba-compact .oba-avatar-host {
  width: 100%;
  max-width: none;
  height: 100%;
}
.oba-panel {
  width: 400px;
  flex: none;
  box-sizing: border-box;
  height: 100%;
  padding: 16px;
  overflow: auto;
  border-left: 1px solid rgba(23, 24, 28, 0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.oba-name {
  margin: 0;
  font-size: 13px;
  line-height: 18px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
}
.oba-label {
  font-size: 11px;
  line-height: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(23, 24, 28, 0.52);
}
.oba-states {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.oba-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.oba-chip {
  appearance: none;
  flex: none;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-states .oba-chip { width: 100%; }
.oba-chip[aria-pressed="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-chip:hover { background: #f1f1f1; }
.oba-chip[aria-pressed="true"]:hover { background: #3a3a3e; }
.oba-presets {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.oba-preset-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.oba-group-name {
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.oba-swatch {
  width: 22px;
  height: 22px;
  padding: 0;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.18);
  cursor: pointer;
}
.oba-swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px #f3f3f4, 0 0 0 4px #17181c;
}
.oba-switch {
  appearance: none;
  flex: none;
  align-self: flex-start;
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-switch[aria-checked="true"] {
  background: #17181c;
  border-color: #17181c;
  color: #ffffff;
}
.oba-stall {
  margin: 0;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.72);
}
.oba-json {
  width: 100%;
  box-sizing: border-box;
  flex: none;
  min-height: 64px;
  height: 64px;
  resize: vertical;
  border-radius: 10px;
  border: 1px solid rgba(23, 24, 28, 0.12);
  background: #ffffff;
  color: #17181c;
  padding: 8px 10px;
  font: 400 12px/16px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.oba-import {
  appearance: none;
  align-self: flex-start;
  flex: none;
  height: 30px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #17181c;
  background: #17181c;
  color: #ffffff;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  cursor: pointer;
}
.oba-import:hover { background: #3a3a3e; }
.oba-errors {
  margin: 0;
  flex: none;
  padding-left: 18px;
  color: #b42318;
  font-size: 12px;
  line-height: 16px;
}
.oba-credit {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  margin: 0;
  text-align: center;
  font-size: 12px;
  line-height: 16px;
  color: rgba(23, 24, 28, 0.62);
}
.oba-credit a { color: inherit; }
#oba-frame > .oba-credit {
  right: auto;
  width: 528px;
}
@media (prefers-reduced-motion: reduce) {
  .oba-chip, .oba-swatch, .oba-import { transition: none; }
}
html[data-reduce-motion="1"] .oba-chip,
html[data-reduce-motion="1"] .oba-swatch,

float fresnelSchlick(float cosTheta) {

vec3 sampleOuterStudio(vec3 dirS, vec3 jewelTint) {
  vec3 d = normalize(dirS);

vec3 sampleInternalStudio(vec3 posS, vec3 dirS, vec3 jewelTint, float isTIR) {
  vec3 d = normalize(dirS);

  // Silky continuous studio cyclorama (color-accurate, zero hard horizon line)
  float upFade = smoothstep(1.0, -1.0, d.y);
  vec3 col = mix(vec3(0.022), jewelTint * 0.22, 0.55) * (0.65 + 0.50 * upFade);

  // Smoothly feathered caustic tabletop bounce beneath the figurine
  float floorRelY = (bottomY - pivot.y) + 2.8;
  if (d.y > -0.05) {
    float dySafe = max(d.y, 0.08);
    float tFloor = clamp((floorRelY - posS.y) / dySafe, 0.0, 260.0);
    vec3 fp = posS + d * tFloor;
    float r2 = dot(fp.xz, fp.xz) / (radius * radius * 0.60);
    float causticPool = exp(-r2 * 0.85);
    float hotCore     = exp(-r2 * 2.4);
    float floorFade   = smoothstep(-0.05, 0.42, d.y);
    col += jewelTint * (1.05 * causticPool + 0.48 * hotCore) * floorFade;

  float upperLeft = pow(max(0.0, dot(d, normalize(vec3(-0.55, -0.72, -0.42)))), 3.2);
  float rightRim  = pow(max(0.0, dot(d, normalize(vec3( 0.82, -0.25, -0.52)))), 3.6);
  float leftRim   = pow(max(0.0, dot(d, normalize(vec3(-0.88,  0.12, -0.46)))), 3.4);
  float topGlow   = pow(max(0.0, dot(d, normalize(vec3( 0.05, -0.92, -0.38)))), 3.0);

  float tirBoost = mix(0.92, 1.22, isTIR);
  col += mix(jewelTint, vec3(1.0), 0.52) * (upperLeft * 1.45 + rightRim * 1.15 + leftRim * 1.05 + topGlow * 1.10) * tirBoost;

  return col;
}

// Trace one ray through the exact 3D Volume SDF (front hit -> up to 3 internal bounces + Beer-Lambert!)
vec4 traceRay(vec2 screenXY, mat3 invView, vec3 jewelTint, vec3 absorbSigma) {

  vec3 ro = pivot + invView * roS;

        break;

    tPrev = t;
    t += max(d * 0.78, 0.06);

  // 6-step bisection on strictly bracketed mapSDF = 0 crossing for razor-clean hit point & normals

  for (int i = 0; i < 6; i++) {
    float mid = 0.5 * (lo + hi);
    if (mapSDF(ro + rd * mid) <= 0.0) hi = mid;
    else lo = mid;
  }
  t = hi;

  vec3 p1 = ro + rd * t;
  vec3 n1 = calcNormal(p1);
  vec3 n1S = normalize(view * n1);
  vec3 p1S = view * (p1 - pivot);
  float cos1 = clamp(dot(-rd, n1), 0.0, 1.0);
  float F1 = fresnelSchlick(cos1);

  // --- Opaque Glossy Black Eyes seated cleanly on the front glass surface ---
  float eyeMask = 0.0;
  vec3 eyeColor = vec3(0.0);
  float eyeBezel = 0.0;
  if (isCapsule == 0) {
    vec2 eyeUV;
    vec3 local;
    float dEye = socketDistance(p1, n1, eyeUV, local);

  float peak = max(accum.r, max(accum.g, accum.b));
  vec3 col = accum;
  if (peak > 0.0001) {
    float mapped = peak / (1.0 + peak * 0.48);
    col = accum * (mapped / peak);

    col = mix(col, vec3(mapped), whiteRoll * 0.80);

  float edgeTransparency = mix(0.36, 0.68, pow(1.0 - cos1, 1.55));

    edgeTransparency
    - 0.12 * clamp(directTrans, 0.0, 1.0)
    + 0.52 * smoothstep(0.16, 0.90, lum)
    + 0.16 * clamp(tirEnergy, 0.0, 1.0),
    0.28,
    0.98

  if (eyeMask > 0.001) {
    float ePeak = max(eyeColor.r, max(eyeColor.g, eyeColor.b));
    vec3 eMapped = ePeak > 0.0001 ? eyeColor * ((ePeak / (1.0 + ePeak * 0.4)) / ePeak) : vec3(0.0);
    col = mix(col, eMapped, eyeMask);
    alpha = mix(alpha, 1.0, eyeMask);
  }

  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  return vec4(col * alpha, alpha);
}
